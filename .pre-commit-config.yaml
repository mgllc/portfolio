# Pre-commit hooks: catches secrets, junk, and obvious lint issues
# before they ever leave your machine.
#
# Setup (once per machine):
#   pip install pre-commit
#   pre-commit install
#
# Runs automatically on every `git commit` from then on.
# Run on the whole repo manually with: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json

  # Secret scanning — same engine used in CI, so nothing that would
  # fail the pipeline can even get committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

