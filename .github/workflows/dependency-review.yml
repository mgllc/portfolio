name: Dependency Review

# Blocks a PR from merging if it introduces a dependency with a known
# vulnerability or an incompatible license. Runs only on PRs since it
# diffs the dependency graph between base and head.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
